[project]
name = "oneworldtour"
version = "2.0.0"
description = "Serverless Claude guide proxy for the One World Tour atlas."
requires-python = ">=3.12"
dependencies = ["anthropic>=0.40.0"]

# api/ask.py is the only server-side code in the project; everything else is
# static. `ask` isn't one of Vercel's default entrypoint filenames, so point
# at it explicitly. The handler ignores the request path, which keeps the
# public URL at /api/ask.
[tool.vercel]
entrypoint = "api.ask:handler"
